<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="theme-color" content="#e4e1db" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    /* Vercel serves this for every path that is not the index. It used to be a
       proper error page, set in the site's two faces, explaining that the URL
       was wrong - and every word of that was readable text on a site whose
       premise is that it carries none. What is left is the ground and a link
       back, and the link has no label because a label is text.

       An unlabelled link is a bad error page. It is also the only error page
       consistent with the decision, and the alternative - rewriting every
       unmatched path to the index - hides the 404 rather than removing the
       text, which is worse: it tells a crawler that every URL on this host
       exists. */
    html, body { margin: 0; height: 100%; background: #e4e1db; }
    a {
      display: block;
      height: 100%;
      /* A single hairline mark, low and left, on the same margin the site uses.
         It is a target and an acknowledgement that something is here, and it
         says nothing. */
      background: linear-gradient(#22211e, #22211e) no-repeat;
      background-size: 44px 1px;
      background-position: clamp(24px, 3.8vw, 96px) calc(100% - clamp(24px, 3.8vw, 96px));
      opacity: 0.55;
    }
    a:hover, a:focus-visible { opacity: 1; }
    a:focus-visible { outline: 1px solid #22211e; outline-offset: -4px; }
  </style>
</head>
<body><a href="/"></a></body>
</html>
