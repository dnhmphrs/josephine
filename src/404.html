<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Not found — Josephine Shen</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <style>
    /* The index is a WebGL canvas; this page deliberately is not. An error page
       that needs a GPU, a texture atlas and a font subset to tell you a URL is
       wrong has misunderstood its job. Same concrete, same two faces, plain DOM. */
    :root { --concrete:#d5d3ce; --ink:#16161a; --ink-2:#4a4c52; --ink-3:#55565c; }
    * { box-sizing: border-box; }
    html { background: var(--concrete); -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      align-items: center;
      padding: clamp(24px, 5.5vw, 80px);
      background: var(--concrete);
      color: var(--ink);
      font: 400 clamp(20px, 2.2vw, 30px)/1.42 "Bodoni Moda Lede", "Bodoni Moda", ui-serif, Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 30em; }
    .eyebrow {
      font: 500 clamp(11px, 0.9vw, 13px)/1.2 "Jost", ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin: 0 0 clamp(18px, 2vw, 28px);
    }
    h1 {
      font: 600 clamp(44px, 6.5vw, 104px)/0.98 "Jost", ui-sans-serif, system-ui, sans-serif;
      letter-spacing: -0.03em;
      margin: 0 0 clamp(20px, 2.4vw, 34px);
    }
    p { margin: 0; color: var(--ink-2); }
    p + p { margin-top: 0.35em; font-size: 0.86em; }
    p:lang(zh) { font-family: "Noto Serif SC", ui-serif, serif; }
    .back {
      display: inline-block;
      margin-top: clamp(26px, 3vw, 42px);
      font: 500 clamp(11px, 0.9vw, 12.5px)/1.2 "Jost", ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(22, 22, 26, 0.3);
      padding-bottom: 4px;
    }
    .back:hover { border-bottom-color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404</p>
    <h1>Nothing here</h1>
    <p>There is no page at this address.</p>
    <p lang="zh-Hans">此处没有页面。</p>
    <a class="back" href="/">Back to the card</a>
  </main>
</body>
</html>
