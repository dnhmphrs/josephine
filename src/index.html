<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Josephine Shen</title>
  <meta name="description" content="Josephine Shen — AI policy researcher. Geopolitics and technology governance across China, the EU and the multilateral system. Berlin." />
  <meta name="author" content="Josephine Shen" />
  <meta name="theme-color" content="#e8e6e1" />

  <!-- One class carries both degraded paths. It is removed immediately if
       scripting is on, and put back by main.js if WebGL turns out not to be -
       so the stylesheet has a single selector for "the mirror is the page". -->
  <script>document.documentElement.classList.remove('no-js')</script>

  <link rel="icon" href="/favicon.ico" sizes="any" />

  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Josephine Shen" />
  <meta property="og:description" content="AI policy researcher. Geopolitics and technology governance. Berlin." />
  <meta property="og:image" content="https://josephine-shen.vercel.app/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Josephine Shen - AI policy researcher. Berlin." />
  <meta property="og:url" content="https://josephine-shen.vercel.app" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Josephine Shen" />
  <meta name="twitter:description" content="AI policy researcher. Geopolitics and technology governance. Berlin." />
  <meta name="twitter:image" content="https://josephine-shen.vercel.app/og.jpg" />

  <!-- Self-hosted, subset webfonts. No third-party request: see
       scripts/fetch-fonts.mjs. Preloaded because the WebGL text atlas cannot be
       rasterised until the real faces are in memory. -->
  <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/noto-sans-sc.woff2" as="font" type="font/woff2" crossorigin />
  <!-- The Chinese serif is on the English critical path too: the Languages
       field reads "English, 中文", and those two characters are set in the
       serif. Discovered here rather than found only when the atlas asks. -->
  <link rel="preload" href="/fonts/noto-serif-sc.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>

  <!-- The entire visible page. Every glyph is rasterised into this canvas by WebGL;
       there is no DOM text in the render path. -->
  <canvas id="stage" aria-hidden="true"></canvas>

  <!-- Native scrolling is preserved by sizing this proxy to the content height
       and translating the canvas scene by scrollY. It also carries the hit
       layer: one transparent <a> or <button> per interactive mark, positioned
       in content coordinates, so tab order, Enter, the pointer cursor, mailto:
       context menus and cmd-click are the browser's job and not ours. Filled
       by main.js. -->
  <div id="scroll"></div>

  <!-- Viewport probes. #svh reports the SMALL viewport height (what is left
       with the browser chrome at its largest), which drives layout so the page
       never jitters as the iOS URL bar animates; #safe reports the notch inset,
       since viewport-fit=cover puts the page under it. -->
  <div id="svh" aria-hidden="true"></div>
  <div id="safe" aria-hidden="true"></div>

  <!-- Accessible mirror: the same strings the canvas draws, exposed to screen
       readers, crawlers and anyone whose GPU refuses. Visually hidden, never
       painted. Populated from content.json by main.js; the document is inlined here so
       it survives with JavaScript disabled. -->
  <!-- The accessible mirror. Every string the canvas draws, as a real
       document, for screen readers, search engines and anyone whose scripting
       or GPU is not available - in which case this stops being a mirror and
       becomes the page. The markup is inlined here at build time and rewritten
       by main.js on load; both come from src/js/mirror.js, so they cannot
       disagree. -->
  <main id="a11y" class="sr"><!--mirror--></main>

  <!-- With scripting off, #a11y above is already the whole document in the
       accessibility tree and in the page; repeating it here would give the
       document two <h1>s and two copies of it that could drift apart.
       This says only the one thing #a11y cannot. -->
  <noscript>
    <p class="noscript">This page draws itself in WebGL, and needs JavaScript to
      do it. What you are reading is the same text, as a plain document.</p>
  </noscript>

<script type="module" src="/js/main.js"></script>
</body>
</html>
