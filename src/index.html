<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- No description, author, Open Graph or Twitter tags, and a title that is
       not made of words.

       Every string this site shows is drawn into a canvas by the GPU, and the
       point of that is defeated by one <title>: a search index reads the head
       before it reads anything else, and the head was the only place her name
       still appeared as text. So the title carries no language at all - it is
       a block-glyph rendering of a hash of the content, written in by the
       build (see titleMark in rollup.config.mjs), and the tag is left empty
       here so the source shows what the page itself contributes: nothing.

       The empty title it replaced was correct and characterless: Chrome falls
       back to the hostname, and the tab read like a parked domain. A mark with
       no lexical content costs an index nothing and gives the tab an identity,
       which is the whole of the trade.

       robots is the load-bearing half of it. Not transmitting a string is the
       only mechanism that is ENFORCED rather than requested; noindex is a
       convention, but it is honoured by every index she cares about, and it is
       what keeps a bare URL out of the results even when someone links here.
       There is deliberately NO robots.txt: Disallow controls crawling, not
       indexing, and a crawler told not to fetch the page never reads this tag -
       so blocking the crawl makes a bare listing MORE likely, not less. The
       matching X-Robots-Tag header in vercel.json covers what a meta tag
       cannot reach: the bundle, the fonts, the licence file. -->
  <title></title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="theme-color" content="#e4e1db" />

  <!-- One class carries both degraded paths. It is removed immediately if
       scripting is on, and put back by main.js if WebGL turns out not to be. -->
  <script>document.documentElement.classList.remove('no-js')</script>

  <link rel="icon" href="/favicon.ico" sizes="any" />

  <!-- Self-hosted, subset webfonts. No third-party request: see
       scripts/fetch-fonts.mjs. Preloaded because the WebGL text atlas cannot be
       rasterised until the real faces are in memory. -->
  <link rel="preload" href="/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/noto-sans-sc.woff2" as="font" type="font/woff2" crossorigin />
  <!-- The Chinese serif is on the English critical path too: the Languages
       field reads "English, 中文", and those two characters are set in the
       serif. Discovered here rather than found only when the atlas asks. -->
  <link rel="preload" href="/fonts/noto-serif-sc.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>

  <!-- The entire visible page. Every glyph is rasterised into this canvas by WebGL;
       there is no DOM text in the render path. -->
  <canvas id="stage" aria-hidden="true"></canvas>

  <!-- Native scrolling is preserved by sizing this proxy to the content height
       and translating the canvas scene by scrollY. It also carries the hit
       layer: one transparent <a> or <button> per interactive mark, positioned
       in content coordinates, so tab order, Enter, the pointer cursor, mailto:
       context menus and cmd-click are the browser's job and not ours. Filled
       by main.js. -->
  <div id="scroll"></div>

  <!-- The second half of the hit layer. Most targets live in the scroll proxy
       above, in content coordinates; the language toggle does not, because it
       is drawn viewport-anchored and has to stay under the pointer while the
       page moves beneath it. Its target is positioned here instead, in a
       fixed box, so the browser keeps it in place for free and no scroll
       arithmetic enters the interaction path. Filled by main.js. -->
  <div id="fixed"></div>

  <!-- Viewport probes. #svh reports the SMALL viewport height (what is left
       with the browser chrome at its largest), which drives layout so the page
       never jitters as the iOS URL bar animates; #safe reports the notch inset,
       since viewport-fit=cover puts the page under it. -->
  <div id="svh" aria-hidden="true"></div>
  <div id="safe" aria-hidden="true"></div>

  <!-- There is no accessible mirror here any more, and its absence is the
       whole change: it was a complete copy of the CV as real HTML, which is
       exactly the text this page exists not to publish. What that costs is
       stated plainly in the README - a screen reader now lands on a document
       that announces nothing, and a visitor without JavaScript or without
       WebGL gets bare ground. That is a decision the owner made, not an
       oversight, and reverting the commit that removed it puts it back. -->

<script type="module" src="/js/main.js"></script>
</body>
</html>
